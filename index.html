<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黑雨 Black Rain | 專屬生活紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-lg shadow">
          🐱
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">黑雨 (Black Rain)</h1>
          <p class="text-xs text-slate-500 mt-1">Silver Tabby British Shorthair</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
          <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
          即時連線中
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

    <!-- 狀態卡片區 -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div class="text-xs text-slate-400 font-medium">最新體重</div>
        <div class="text-2xl font-black text-slate-800 mt-1" id="latest-weight">5.10 kg</div>
        <div class="text-[10px] text-slate-400 mt-0.5" id="latest-weight-date">記錄於 8/8/2026</div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div class="text-xs text-slate-400 font-medium">年齡</div>
        <div class="text-2xl font-black text-slate-800 mt-1">1 歲+</div>
        <div class="text-[10px] text-slate-400 mt-0.5">2025 年 8 月回家</div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div class="text-xs text-slate-400 font-medium">飲食戒律</div>
        <div class="text-sm font-bold text-rose-600 mt-2 flex items-center">
          <i class="fa-solid fa-ban mr-1.5"></i> 嚴禁雞肉配方
        </div>
        <div class="text-[10px] text-slate-400 mt-0.5">避免過敏 / 腸胃軟便</div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div class="text-xs text-slate-400 font-medium">糧食與補給庫</div>
        <div class="text-2xl font-black text-indigo-600 mt-1" id="food-count">19 款</div>
        <div class="text-[10px] text-slate-400 mt-0.5">已試過並記錄</div>
      </div>
    </div>

    <!-- 體重追蹤折線圖 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-base font-bold text-slate-900 flex items-center">
            <i class="fa-solid fa-chart-line text-blue-500 mr-2"></i> 成長體重曲線
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">即時同步 Google Sheet「重量」分頁</p>
        </div>
        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-md" id="weight-count">30 筆記錄</span>
      </div>
      <div class="h-64 sm:h-72 w-full">
        <canvas id="weightChart"></canvas>
      </div>
    </section>

    <!-- 飲食評分庫 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 border-b border-slate-100 gap-3">
        <div>
          <h2 class="text-base font-bold text-slate-900 flex items-center">
            <i class="fa-solid fa-bowl-food text-amber-500 mr-2"></i> 黑雨飲食評分庫
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">喺 Google Sheet 改動即自動更新分類</p>
        </div>
        <!-- 類別篩選按鈕 -->
        <div class="flex space-x-1.5 text-xs overflow-x-auto pb-1 sm:pb-0" id="filter-buttons">
          <button onclick="setCategoryFilter('all')" class="filter-btn active px-3 py-1.5 rounded-full bg-slate-900 text-white font-medium shadow-sm transition">全部</button>
          <button onclick="setCategoryFilter('乾糧')" class="filter-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition">乾糧</button>
          <button onclick="setCategoryFilter('濕糧')" class="filter-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition">濕糧</button>
          <button onclick="setCategoryFilter('湯罐')" class="filter-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition">湯罐</button>
        </div>
      </div>

      <!-- 食物卡片清單 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4" id="food-list">
      </div>
    </section>

    <!-- 補給與常用連結 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-base font-bold text-slate-900 flex items-center mb-3">
        <i class="fa-solid fa-link text-indigo-500 mr-2"></i> 常用補給連結
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-xs">
        <a href="https://zh.wnp.com.hk" target="_blank" class="flex items-center justify-between p-3 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200/80 transition">
          <span class="font-semibold text-slate-700">WnP 訂糧平台</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-slate-400"></i>
        </a>
        <a href="https://www.streetcatshostel.com.hk/" target="_blank" class="flex items-center justify-between p-3 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200/80 transition">
          <span class="font-semibold text-slate-700">街貓旅社補給</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-slate-400"></i>
        </a>
        <a href="https://www.vetopia.com.hk/" target="_blank" class="flex items-center justify-between p-3 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200/80 transition">
          <span class="font-semibold text-slate-700">Vetopia 驅蟲用品</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-slate-400"></i>
        </a>
      </div>
    </section>

  </main>

  <footer class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400 mt-
